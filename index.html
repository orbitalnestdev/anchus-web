    <!-- Preload Critical LCP Image for High Performance -->

      rel="preload" 
      as="image" 
      href="/assets/home/hero_full_1200.avif"

    <!-- Optimized Deferred Google Tag Manager -->
    <script>
      (function() {
        var gtmLoaded = false;
        function loadGTM() {
          if (gtmLoaded) return;
          gtmLoaded = true;
          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':

          })(window,document,'script','dataLayer','GTM-WDBDBLK3');
        }

        // Load GTM after user interaction or 2.5s idle timer
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(function() { setTimeout(loadGTM, 2000); });
        } else {
          setTimeout(loadGTM, 2500);
        }
        ['touchstart', 'mousemove', 'scroll', 'keydown'].forEach(function(evt) {
          window.addEventListener(evt, loadGTM, { once: true, passive: true });
